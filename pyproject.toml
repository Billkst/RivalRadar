[project]
name = "rivalradar"
version = "0.6.2.0"
description = "AI 多 Agent 竞品分析协作系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.2.0",
    "tavily-python>=0.5",
    "exa-py>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    # Postgres 驱动:仅 DATABASE_URL=postgres:// 时懒加载(Supabase 等云部署)。
    # 本地默认走 SQLite,db.py 不会 import psycopg;Render 部署靠这条装上。
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["rivalradar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
